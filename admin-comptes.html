<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestion des comptes — Kfet Polytech Dijon</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Scripts communs (ordre important), puis le script de la page -->
  <script src="js/api.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/mock.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/catalog-api.js" defer></script>
  <script src="js/orders-api.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/layout.js" defer></script>
  <script src="js/admin-comptes.js" defer></script>
</head>
<body>
  <header class="header" id="site-header"></header>

  <main>
    <nav class="subnav" data-subnav="admin"></nav>

    <h1>Gestion des comptes</h1>
    <p class="subtitle">Bloquez un compte (par exemple après plusieurs réservations non récupérées) ou débloquez-le.</p>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <input class="input" id="search" type="search" placeholder="Rechercher un utilisateur…" aria-label="Rechercher un utilisateur">
      <label class="toolbar__field">Afficher
        <select class="input input--select" id="filter" aria-label="Filtrer les comptes">
          <option value="all">Tous</option>
          <option value="user">Étudiants</option>
          <option value="admin">Administrateurs</option>
          <option value="locked">Bloqués</option>
          <option value="no_show">Souvent absents (≥ 2 non retirées)</option>
        </select>
      </label>
    </div>

    <p class="flash" id="flash" role="status" hidden></p>

    <section class="admin-list" id="users" aria-live="polite"></section>
  </main>
</body>
</html>
